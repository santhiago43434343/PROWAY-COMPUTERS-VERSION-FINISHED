server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamanho máximo de upload (ajuste se precisar)
    client_max_body_size 10m;

    # Encaminha as chamadas de API para o backend Rails.
    # Ex.: /api/checkouts -> http://web:3000/api/v1/checkouts
    #
    # IMPORTANTE: usamos o resolver do Docker (127.0.0.11) + o host numa variável.
    # Com hostname fixo em proxy_pass, o nginx resolve "web" no BOOT e, se o backend
    # ainda não subiu, morre com "[emerg] host not found in upstream 'web'" e entra
    # em loop de restart. Com a variável, ele resolve "web" a CADA request: sobe
    # sempre e devolve 502 enquanto o backend não estiver pronto (sem derrubar tudo).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "web";

        # /api/checkouts -> /api/v1/checkouts (mesmo rewrite de antes)
        rewrite ^/api/(.*)$ /api/v1/$1 break;

        proxy_pass         http://$backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets com hash
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
