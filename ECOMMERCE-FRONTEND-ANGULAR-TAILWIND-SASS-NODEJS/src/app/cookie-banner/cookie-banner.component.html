@if (pronto) {

  <!-- Barra de consentimento (aparece só enquanto não houver decisão) -->
  @if (mostrarBanner) {
    <div class="cookie-bar fixed bottom-0 left-0 right-0 z-[9998] bg-white border-t-4 border-blue-600 shadow-[0_-4px_20px_rgba(0,0,0,0.15)] px-4 py-4 md:px-8">
      <div class="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center gap-4 md:gap-6">
        <div class="flex items-start gap-3 flex-1">
          <i class="fa-solid fa-cookie-bite text-amber-500 text-2xl mt-1"></i>
          <p class="text-sm text-gray-700 leading-relaxed">
            Usamos cookies para melhorar sua experiência, analisar o tráfego e personalizar conteúdo.
            Você pode aceitar todos ou escolher suas preferências. Saiba mais na nossa
            <a routerLink="/politica-privacidade" class="text-blue-600 font-medium underline hover:text-blue-800">Política de Privacidade</a>.
          </p>
        </div>

        <div class="flex flex-wrap gap-2 shrink-0">
          <button type="button" (click)="abrirPreferencias()"
                  class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition text-sm font-medium">
            Personalizar
          </button>
          <button type="button" (click)="recusar()"
                  class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition text-sm font-medium">
            Recusar
          </button>
          <button type="button" (click)="aceitarTudo()"
                  class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition text-sm font-semibold shadow">
            Aceitar tudo
          </button>
        </div>
      </div>
    </div>
  }

  <!-- Botão flutuante: reabre as preferências a qualquer momento -->
  <button type="button" (click)="abrirPreferencias()"
          aria-label="Preferências de cookies"
          class="fixed bottom-6 right-6 z-[9997] bg-yellow-500 p-3 rounded-full shadow-lg hover:scale-110 transition duration-300 ease-in-out">
    <img src="icons/1047711.png" alt="Cookies" class="w-8 h-8" />
  </button>

  <!-- Modal de preferências -->
  @if (mostrarPainel) {
    <app-cookie-panel (salvar)="aoSalvar()" (fechar)="mostrarPainel = false"></app-cookie-panel>
  }

}
