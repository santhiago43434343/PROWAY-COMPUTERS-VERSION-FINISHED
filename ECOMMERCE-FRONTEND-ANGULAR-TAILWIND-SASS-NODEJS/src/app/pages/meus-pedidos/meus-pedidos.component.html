<div class="max-w-4xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-black text-gray-800 mb-6">Meus Pedidos</h1>

  <p *ngIf="carregando" class="text-gray-600">Carregando seus pedidos...</p>
  <p *ngIf="erro" class="text-red-600 font-medium">{{ erro }}</p>

  <p *ngIf="!carregando && !erro && pedidos.length === 0" class="text-gray-600">
    Você ainda não tem pedidos. 🛒
  </p>

  <!-- Barra de ações em massa: selecionar todos + excluir de uma vez -->
  <div *ngIf="!carregando && !erro && pedidos.length > 0"
       class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <label class="inline-flex items-center gap-2 text-sm font-semibold text-gray-700 cursor-pointer select-none">
      <input type="checkbox" [checked]="todosSelecionados" (change)="toggleTodos($event)"
             class="w-4 h-4 accent-red-500 rounded cursor-pointer" />
      Selecionar todos
      <span *ngIf="algumSelecionado" class="text-gray-400 font-normal">
        ({{ selecionados.size }} de {{ pedidos.length }})
      </span>
    </label>

    <div class="flex flex-wrap items-center gap-2">
      <button type="button" (click)="excluirSelecionados()"
              [disabled]="!algumSelecionado || excluindoEmMassa"
              class="inline-flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-xl transition
                     bg-red-500 text-white hover:bg-red-600
                     disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed">
        🗑️ {{ excluindoEmMassa ? 'Excluindo...' : 'Excluir selecionados' }}
        <span *ngIf="algumSelecionado && !excluindoEmMassa">({{ selecionados.size }})</span>
      </button>

      <button type="button" (click)="excluirTodos()"
              [disabled]="excluindoEmMassa"
              class="inline-flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-xl transition
                     border-2 border-red-500 text-red-600 hover:bg-red-50
                     disabled:border-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed">
        🗑️ Excluir todos ({{ pedidos.length }})
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div *ngFor="let p of pedidos"
         [ngClass]="{ 'ring-2 ring-red-400 border-red-200': estaSelecionado(p) }"
         class="bg-white border border-gray-100 rounded-2xl shadow-sm p-5 transition">
      <div class="flex justify-between items-center mb-2">
        <label class="inline-flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" [checked]="estaSelecionado(p)" (change)="toggleSelecionado(p)"
                 class="w-4 h-4 accent-red-500 rounded cursor-pointer" />
          <span class="text-xs font-black text-gray-400 uppercase">Pedido #{{ p.id }}</span>
        </label>
        <span [ngClass]="{
                'bg-green-100 text-green-700 border border-green-200': p.status === 'pago',
                'bg-yellow-100 text-yellow-700 border border-yellow-200': p.status === 'pendente',
                'bg-red-100 text-red-700 border border-red-200': p.status === 'cancelado'
              }"
              class="text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider">
          {{ p.status }}
        </span>
      </div>

      <p class="text-2xl font-black text-green-600 mb-1">R$ {{ p.total | number:'1.2-2' }}</p>
      <p class="text-sm text-gray-500">Pagamento: <span class="uppercase">{{ p.payment }}</span></p>
      <p class="text-sm text-gray-500">Rastreio: <span class="font-semibold">{{ rastreio(p) }}</span></p>
      <p class="text-xs text-gray-400 mt-1">{{ p.created_at | date:'dd/MM/yyyy HH:mm' }}</p>

      <div class="mt-3 pt-3 border-t border-gray-100 flex justify-end gap-4">
        <button *ngIf="p.status === 'pendente'" (click)="cancelar(p, $event)"
                class="text-sm font-semibold text-orange-500 hover:text-orange-700 transition">
          ✖ Cancelar pedido
        </button>
        <button (click)="excluir(p, $event)"
                class="text-sm font-semibold text-red-500 hover:text-red-700 transition">
          🗑️ Excluir
        </button>
      </div>
    </div>
  </div>
</div>
