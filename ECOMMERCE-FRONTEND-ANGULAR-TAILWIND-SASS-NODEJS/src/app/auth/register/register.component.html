<div class="min-h-[70vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-lg p-8">

    <!-- Formulário de cadastro -->
    <ng-container *ngIf="!cadastrado">
      <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Criar conta</h1>

      <form (ngSubmit)="cadastrar()" #f="ngForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="nome">Nome</label>
          <input id="nome" name="nome" type="text" [(ngModel)]="nome" required
            class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
            placeholder="Seu nome" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="email">E-mail</label>
          <input id="email" name="email" type="email" [(ngModel)]="email" required
            class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
            placeholder="voce@exemplo.com" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="senha">Senha</label>
          <div class="relative">
            <input id="senha" name="senha" [type]="mostrarSenha ? 'text' : 'password'" [(ngModel)]="senha" required minlength="6"
              class="w-full px-4 py-2 pr-11 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="mínimo 6 caracteres" />
            <button type="button" (click)="mostrarSenha = !mostrarSenha"
              [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600">
              <svg *ngIf="!mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1 1 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg *ngIf="mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9c2.5 3.4 6 5.2 9 5.2s6.5-1.8 9-5.2 M6 13.6l-1.2 2.2 M12 15.2v2.4 M18 13.6l1.2 2.2" />
              </svg>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="conf">Confirmar senha</label>
          <div class="relative">
            <input id="conf" name="conf" [type]="mostrarSenha ? 'text' : 'password'" [(ngModel)]="confirmacao" required
              class="w-full px-4 py-2 pr-11 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="••••••••" />
            <button type="button" (click)="mostrarSenha = !mostrarSenha"
              [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600">
              <svg *ngIf="!mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1 1 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg *ngIf="mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9c2.5 3.4 6 5.2 9 5.2s6.5-1.8 9-5.2 M6 13.6l-1.2 2.2 M12 15.2v2.4 M18 13.6l1.2 2.2" />
              </svg>
            </button>
          </div>
        </div>

        <p *ngIf="erro" class="text-sm text-red-600">{{ erro }}</p>

        <button type="submit" [disabled]="carregando || f.invalid"
          class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-xl hover:bg-blue-700 disabled:opacity-50 transition">
          {{ carregando ? 'Criando...' : 'Criar conta' }}
        </button>

        <p class="text-center text-sm text-gray-500">
          Já tem conta? <a routerLink="/login" class="text-blue-600 hover:underline">Entrar</a>
        </p>
      </form>
    </ng-container>

    <!-- Sucesso: precisa confirmar o e-mail -->
    <ng-container *ngIf="cadastrado">
      <div class="text-center">
        <div class="text-6xl mb-3">📧</div>
        <h1 class="text-2xl font-bold text-green-600 mb-2">Conta criada!</h1>
        <p class="text-gray-600">
          Enviamos um <strong>e-mail de confirmação</strong>. Confirme seu e-mail para poder fazer login.
        </p>
        <p class="text-sm text-gray-400 mt-2">(No ambiente de testes, o e-mail chega na sua inbox do Mailtrap.)</p>
        <a routerLink="/login"
           class="inline-block mt-6 bg-blue-600 text-white font-semibold px-6 py-2.5 rounded-xl hover:bg-blue-700 transition">
          Ir para o login
        </a>
      </div>
    </ng-container>
  </div>
</div>
