<div class="max-w-4xl mx-auto p-4">
  <h2 class="text-2xl font-black mb-6 border-b-4 border-indigo-500 inline-block">Revisão</h2>

  <div class="space-y-4 mb-6">
    <div *ngFor="let item of orderData?.cart"
         class="flex items-center gap-4 border p-4 rounded-2xl bg-white shadow-sm">
      <img [src]="item.imagem" class="w-16 h-16 object-cover rounded-xl" />
      <div class="flex-1">
        <p class="font-bold text-gray-800">{{ item.nome }}</p>
        <p class="text-sm text-gray-500">Qtd: {{ item.quantidadeSelecionada || 1 }}</p>
        <p class="text-red-500 font-black">R$ {{ item.preco | number:'1.2-2' }}</p>
      </div>
    </div>
    <p *ngIf="!orderData?.cart?.length" class="text-gray-500 italic">Seu carrinho está vazio.</p>
  </div>

  <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl mb-4 shadow-inner">
    <span class="font-bold text-gray-700">Total</span>
    <span class="text-2xl font-black text-green-600">R$ {{ total | number:'1.2-2' }}</span>
  </div>

  <p class="text-sm text-gray-500 mb-6">
    Forma de pagamento: <span class="font-bold uppercase text-indigo-600">{{ metodo || '—' }}</span>
  </p>

  <div class="flex flex-wrap gap-4 items-center bg-gray-50 p-6 rounded-3xl shadow-inner">
    <button (click)="back.emit()"
            class="bg-gray-200 hover:bg-gray-300 px-6 py-2 rounded-xl font-bold transition-all">
      Voltar
    </button>

    <!-- Mercado Pago / Pix: usa o fluxo do checkout (redirect MP ou tela do PIX) -->
    <button *ngIf="metodo !== 'paypal'"
            (click)="finalizar()"
            class="bg-green-500 hover:bg-green-600 text-white px-8 py-2 rounded-xl font-bold">
      Finalizar Pedido
    </button>

    <!-- PayPal: botão oficial renderizado aqui -->
    <div *ngIf="metodo === 'paypal'" id="paypal-button-container" class="w-full md:w-72 min-h-[50px]"></div>
  </div>

  <div *ngIf="erro"
       class="mt-4 p-3 bg-red-100 text-red-700 rounded-xl text-sm font-bold text-center border border-red-200">
    {{ erro }}
  </div>
</div>
